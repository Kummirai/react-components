<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#01312D"/>
      <stop offset="100%" stop-color="#3A7717"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bff202"/>
      <stop offset="100%" stop-color="#72bf00"/>
    </linearGradient>
  </defs>
  <!-- Phone frame -->
  <rect x="170" y="30" rx="24" width="200" height="340" fill="url(#ph)" stroke="#333" stroke-width="2"/>
  <rect x="178" y="34" rx="20" width="184" height="332" fill="#eafde7"/>
  <!-- Notch -->
  <rect x="230" y="30" rx="0 0 10 10" width="80" height="14" fill="#1a1a1a"/>
  <!-- Status bar -->
  <text x="192" y="58" font-family="sans-serif" font-size="7" font-weight="600" fill="#01312D">12:00</text>
  <!-- Decorative orb -->
  <circle cx="300" cy="80" r="70" fill="rgba(191,242,2,0.08)"/>
  <!-- Header -->
  <rect x="184" y="62" rx="6" width="22" height="22" fill="url(#dg)"/>
  <polygon points="192,72 198,72 195,78 193,78 196,72 190,72" fill="#bff202"/>
  <text x="212" y="76" font-family="sans-serif" font-size="11" font-weight="800" fill="#01312D">Kapuka</text>
  <text x="212" y="86" font-family="sans-serif" font-size="5" font-weight="700" fill="#72bf00">TRADINGS</text>
  <rect x="330" y="65" rx="999" width="20" height="10" fill="#bff202"/>
  <text x="334" y="73" font-family="sans-serif" font-size="5" font-weight="700" fill="#01312D">Driver</text>
  <!-- Hero card -->
  <rect x="184" y="92" rx="10" width="172" height="62" fill="url(#dg)"/>
  <text x="192" y="104" font-family="sans-serif" font-size="5" font-weight="700" fill="#bff202">JOIN US</text>
  <text x="192" y="118" font-family="sans-serif" font-size="11" font-weight="800" fill="#fff">Get Fuel / Car Wash</text>
  <text x="192" y="130" font-family="sans-serif" font-size="11" font-weight="800" fill="#bff202">Services</text>
  <text x="192" y="140" font-family="sans-serif" font-size="6" fill="rgba(255,255,255,0.65)">with Kapuka Tradings</text>
  <rect x="192" y="144" rx="4" width="90" height="12" fill="#fff"/>
  <text x="198" y="153" font-family="sans-serif" font-size="6" font-weight="700" fill="#01312D">Refuel, Work And Pay →</text>
  <!-- Feature pills -->
  <rect x="184" y="160" rx="999" width="54" height="12" fill="#fff" stroke="#e8eceb" stroke-width="0.5"/>
  <circle cx="190" cy="166" r="2.5" fill="#3A7717"/>
  <text x="195" y="169" font-family="sans-serif" font-size="5" font-weight="600" fill="#01312D">24/7 Support</text>
  <rect x="242" y="160" rx="999" width="58" height="12" fill="#fff" stroke="#e8eceb" stroke-width="0.5"/>
  <circle cx="248" cy="166" r="2.5" fill="#3A7717"/>
  <text x="253" y="169" font-family="sans-serif" font-size="5" font-weight="600" fill="#01312D">No Hidden Fees</text>
  <!-- CTA -->
  <rect x="184" y="176" rx="15" width="66" height="16" fill="url(#dg)"/>
  <text x="195" y="188" font-family="sans-serif" font-size="7" font-weight="700" fill="#fff">Get Started →</text>
  <!-- Available Services -->
  <text x="184" y="206" font-family="sans-serif" font-size="7" font-weight="700" fill="#01312D">Available Services</text>
  <!-- Service cards: 2 on top -->
  <rect x="184" y="210" rx="7" width="76" height="44" fill="#fff" stroke="#e8eceb" stroke-width="0.5"/>
  <rect x="188" y="214" rx="5" width="20" height="18" fill="url(#dg)"/>
  <polygon points="194,218 196,218 196,224 194,224" fill="#fff"/>
  <text x="188" y="241" font-family="sans-serif" font-size="7" font-weight="700" fill="#01312D">Fuel</text>
  <text x="188" y="249" font-family="sans-serif" font-size="5" fill="#9CA3AF">Petrol • Diesel</text>

  <rect x="266" y="210" rx="7" width="76" height="44" fill="#fff" stroke="#e8eceb" stroke-width="0.5"/>
  <rect x="270" y="214" rx="5" width="20" height="18" fill="url(#dg)"/>
  <path d="M276 220l2-8h8l2 8v2h-12z" stroke="#fff" stroke-width="1.2" fill="none"/>
  <text x="270" y="241" font-family="sans-serif" font-size="7" font-weight="700" fill="#01312D">Car Wash</text>
  <text x="270" y="249" font-family="sans-serif" font-size="5" fill="#9CA3AF">Premium cleaning</text>
  <!-- Service card: 1 bottom centered -->
  <rect x="261" y="258" rx="7" width="76" height="44" fill="#fff" stroke="#e8eceb" stroke-width="0.5"/>
  <rect x="265" y="262" rx="5" width="20" height="18" fill="url(#lg)"/>
  <rect x="272" y="266" rx="1" width="6" height="10" fill="none" stroke="#01312D" stroke-width="1.2"/>
  <text x="265" y="289" font-family="sans-serif" font-size="7" font-weight="700" fill="#01312D">Cash Loan</text>
  <text x="265" y="297" font-family="sans-serif" font-size="5" fill="#9CA3AF">26% • 14 days</text>
  <!-- Bottom tab bar -->
  <rect x="178" y="352" width="184" height="14" fill="#fff"/>
  <line x1="178" y1="352" x2="362" y2="352" stroke="#e8eceb" stroke-width="0.5"/>
  <text x="205" y="363" font-family="sans-serif" font-size="6" font-weight="600" fill="#01312D" text-anchor="middle">Home</text>
  <text x="250" y="363" font-family="sans-serif" font-size="6" fill="#999" text-anchor="middle">Requests</text>
  <text x="295" y="363" font-family="sans-serif" font-size="6" fill="#999" text-anchor="middle">History</text>
  <text x="340" y="363" font-family="sans-serif" font-size="6" fill="#999" text-anchor="middle">Profile</text>
